name: CI Deep
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deep:
    runs-on: ${{ vars.PM_LOCAL_DEEP == 'on' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
        runtime: [npm, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: package.json
      - if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun --version
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - if: matrix.runtime == 'npm'
        run: npm run release:check
      - if: matrix.runtime == 'bun'
        run: rm -rf node_modules && bun install --no-save
      - if: matrix.runtime == 'bun'
        run: bun run release:check
      - if: matrix.runtime == 'bun'
        run: bun run test:bun
